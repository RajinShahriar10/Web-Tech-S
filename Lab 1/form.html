<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
        <link rel="icon" href="images.png">
    </head>
    <body>
        <h3>Account Creation Form</h3>
        <form action="form-handler.html" method="get">
            <label for="first-name">First Name: </label>
            <input type="text" name="fn" id="first-name" placeholder="First Name" required>
            <br>
            <label for="last-name">Last Name: </label>
            <input type="text" name="ln" id="Last-name" placeholder="Last Name" required>
            <br>
            <label for="email">Email: </label>
            <input type="email" name="en" id="email" placeholder="Email" required>
            <br>
            <label for="password">Password: </label>
            <input type="password" name="ps" id="password" placeholder="Password" required>
            <br>
            <label for="confirm_password">Confirm Password: </label>
            <input type="password" name="cps" id="confirm_password" placeholder="Confirm Password" required>
            <br><br>
            <input type="submit" value="Create Your Account" name="" id="">
            <input type="reset" name="" id="">
        </form>
    </body>
</html>
